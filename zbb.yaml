name: "@zerobias-org/product"
version: "1.0.0"

# Dataloader validation runs against an ephemeral Neon Postgres branch
# provisioned by NeonDataloaderTask at task-execution time (same pattern
# as vendor / suite / tag / module). The task creates and deletes its
# own branch via the Neon API.
env:
  # ── Org-first SDLC credentials (set per slot: `zbb --slot <s> env set …`).
  # Declared here so `zbb env set` works (undeclared vars are a no-op) and
  # so they reach the gradle build regardless of the command env contract.
  # scripts/setup-org-credentials.sh manages all of these — run it yourself
  # in a normal terminal; it prompts only for what's missing.
  ZB_TOKEN:
    type: secret
    mask: true
    description: >-
      REGISTRY key — auths pkg.zerobias.org (npm view/publish, .npmrc
      interpolation) and the gate's Neon dataloader step (the step runs
      iff this is present). Must be a PROD-issued key while the registry
      accepts only prod keys.

  ZB_API_KEY:
    type: secret
    mask: true
    description: >-
      ORG key (two-key setup): org OWNER API key of the publishOrg TARGET
      org/env. When set, the ORG PUBLISH platform calls (dana /me verify,
      dataloader org job) use it and ZB_TOKEN stays the npm/registry
      credential. Unset = single-key setup (ZB_TOKEN does both — only
      viable when one key satisfies both services). Requires build-tools
      with the ZB_API_KEY split (util PR#110).

  ZB_ORG_ID:
    type: string
    description: >-
      Target org UUID (also mirrored into package.json zerobias.orgId by
      the create skills; stored here so launch shells can read it back:
      `zbb --slot <s> env get ZB_ORG_ID`)

  ZB_PLATFORM_URL:
    type: string
    default: "https://app.zerobias.com/api"
    description: Platform API base for verifyOrgPublish + the org dataloader job

  DATALOADER_SERVICE_URL:
    type: string
    default: "https://app.zerobias.com/api/dataloader"
    description: >-
      Dataloader endpoint for the GATE's Neon step (separate from
      ZB_PLATFORM_URL — the gate does not honor that var). LEAVE ON THE
      PROD DEFAULT even for non-prod org targets: the step auths with the
      prod-issued ZB_TOKEN, and a per-env override makes that key 401.
      The org load never reads this (it uses ZB_PLATFORM_URL + ZB_API_KEY).

  NPM_CONFIG_TAG:
    type: string
    default: "dev"
    description: >-
      npm dist-tag for org-private rc publishes (npm 11 refuses prerelease
      publishes without one; catalog publishes pass --tag explicitly, so
      this default is inert for them).

  KNOWLEDGE_MCP_URL:
    type: string
    default: "https://api.app.zerobias.com/knowledge-mcp/mcp"
    description: >-
      Per-env zb-knowledge MCP endpoint (keys are per-env; the .mcp.json
      default is PROD, so non-prod slots need their own value —
      setup-org-credentials.sh derives it from ZB_PLATFORM_URL).

  NEON_API_KEY:
    source: vault
    vault: "operations-kv/neon/content.api-key"
    mask: true

  NEON_PROJECT_ID:
    source: vault
    vault: "operations-kv/neon/content.project-id"

  NEON_PARENT_BRANCH:
    type: string
    default: "content-master"
    description: Neon parent branch to create test branches from

  NEON_DB_ROLE:
    type: string
    default: "neondb_owner"
    description: Neon database role

  NEON_DB_NAME:
    type: string
    default: "zerobias"
    description: Neon database name

# ── Lifecycle ────────────────────────────────────────────────────────
# Content repos have no generate/compile/Docker phases, so the chain
# reduces to validate + dataloader + publishNpm + promote.
lifecycle:
  clean:     ./gradlew clean
  build:     ./gradlew build
  test:      ./gradlew test
  gate:      ./gradlew gate
  gateCheck: ./gradlew gateCheck
  publish:   ./gradlew publish

require:
  - tool: dataloader
    check: "dataloader --version 2>&1"
    parse: "Dataloader v(\\S+)"
    version: ">=1.0.87"
    install: "npm i -g @zerobias-com/platform-dataloader"

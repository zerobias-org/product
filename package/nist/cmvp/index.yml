description: The CMVP is the U.S. government program under NIST that validates
  cryptographic modules against FIPS 140-2/140-3, the standard federal law requires
  U.S. Government systems to use for cryptographic modules. Vendors submit modules
  for evaluation; NIST publishes the results, including certificate status, sunset
  date, and the specific caveats (e.g. required OS/software versions and configuration)
  under which each validation applies.

id: ead10d7e-d081-49b0-b0cf-9737b84e81c4
name: Cloud Security Posture Management (CSPM)
description: >-
  Continuously detects and helps remediate cloud misconfigurations from build time through runtime with full risk context.
background: >-
  CSPM is the foundational capability of Wiz Cloud, continuously assessing cloud resources across AWS, Azure, GCP, OCI, and Alibaba Cloud for misconfigurations and policy violations. Rather than producing an undifferentiated list of alerts, it uses the Wiz Security Graph to correlate misconfigurations with exposure, identity, and vulnerability data so teams can prioritize the issues that create real attack paths. Findings span from build-time infrastructure as code through running cloud resources, giving a single, contextual view of cloud posture.

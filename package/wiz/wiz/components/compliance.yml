id: 20e6e16b-1042-4723-bc93-6ed77f91481e
name: Compliance
description: >-
  Continuously assesses cloud environments against more than 100 built-in frameworks plus custom frameworks.
background: >-
  The Compliance capability continuously evaluates an organization's cloud posture against a library of more than 100 built-in regulatory and industry frameworks, including CIS, SOC 2, PCI DSS, HIPAA, ISO 27001, NIST, and GDPR. It maps Wiz findings to specific controls, highlights gaps, and tracks compliance posture over time so teams can demonstrate adherence on demand. Organizations can also author custom frameworks to reflect internal policies, turning continuous cloud assessment into audit-ready evidence.

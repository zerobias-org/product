id: 70f1e499-254d-44f5-99ca-2bafe6cb748c
name: Data Detection & Response (DDR)
description: >-
  Detects anomalous runtime access to sensitive data that indicates malicious behavior.
background: >-
  DDR extends Wiz Defend's runtime detection to the data layer, watching for abnormal access to the sensitive data stores discovered and classified by DSPM. It identifies suspicious patterns — such as unusual exfiltration, access from unexpected identities, or activity inconsistent with normal behavior — that may signal a data breach in progress. By correlating data-access anomalies with broader cloud and identity context in the Wiz Security Graph, it helps teams detect and respond to data-centric attacks before information leaves the environment.

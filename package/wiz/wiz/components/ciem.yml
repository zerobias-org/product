id: 22691301-9a44-4d51-b2a0-6bf7eaaf6128
name: Cloud Infrastructure Entitlement Management (CIEM)
description: >-
  Analyzes cloud entitlements to surface identity risk and generate least-privilege policy recommendations.
background: >-
  CIEM secures cloud identities by mapping the effective permissions of human and machine identities across multi-cloud environments. It surfaces excessive, unused, and risky entitlements and traces how identity access combines with other exposures to form attack paths through the Wiz Security Graph. To close the gap, it recommends right-sized, least-privilege policies, helping teams enforce the principle of least privilege without breaking workloads.

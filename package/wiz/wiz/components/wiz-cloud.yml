id: 21059429-baa5-4b19-8a33-f0d6c4ebdd22
name: Wiz Cloud
description: >-
  Agentless cloud security posture pillar that unifies CSPM, CIEM, DSPM, and cloud workload protection across multi-cloud environments.
background: >-
  Wiz Cloud is one of the three pillars of the Wiz platform, delivering agentless posture management for cloud and AI environments built on the Wiz Security Graph. It continuously scans AWS, Azure, GCP, OCI, Alibaba Cloud, and Kubernetes to surface misconfigurations, excessive entitlements, exposed data, and vulnerable workloads in one console. By correlating findings into prioritized attack paths, it gives security and platform teams the full context needed to focus on the risks that actually matter.

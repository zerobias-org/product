id: 1abbf9d0-b961-4bae-9a28-af942684a1c1
name: Infrastructure as Code (IaC) Scanning
description: >-
  Scans infrastructure as code against more than 1,000 rules across Terraform, CloudFormation, ARM, Kubernetes, and Docker.
background: >-
  IaC Scanning shifts cloud security left by analyzing infrastructure-as-code templates for misconfigurations before they are ever deployed. It evaluates Terraform, CloudFormation, ARM, Kubernetes manifests, and Dockerfiles against a library of more than 1,000 rules, catching insecure defaults and policy violations at the pull-request stage. Because the same policies span code and running cloud, teams get consistent enforcement from build time to runtime and can prevent drift between intended and actual configuration.

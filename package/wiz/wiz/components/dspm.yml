id: 221ed96c-7f9e-4b87-96bf-0c90efd96e63
name: Data Security Posture Management (DSPM)
description: >-
  Discovers and classifies sensitive data and detects data-related risks and attack paths with full context.
background: >-
  DSPM gives teams visibility into where sensitive data lives across their cloud estate by automatically discovering and classifying data stores and the records within them. It then evaluates the security posture around that data — public exposure, excessive access, and misconfiguration — and surfaces the attack paths that could lead to a breach. By tying data context into the Wiz Security Graph, it helps organizations protect their most critical information and meet data-protection compliance obligations.

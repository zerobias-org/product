id: f1417994-3177-427d-9ae5-44f6e7e573b1
name: Wiz Defend
description: >-
  Cloud detection and response pillar providing real-time runtime threat detection, investigation, and response for cloud and AI-native threats.
background: >-
  Wiz Defend is the runtime security pillar of the Wiz platform, adding real-time threat detection and response to Wiz's posture management capabilities. It combines agentless cloud activity analysis with the eBPF-based Wiz Sensor to detect, investigate, and stop attacks against VMs, containers, serverless functions, and identities. By enriching detections with the same Wiz Security Graph context used for posture, it helps SecOps teams cut through noise, understand attacker movement, and respond to cloud and AI-native threats faster.

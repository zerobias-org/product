id: 21ec0278-52c3-45cf-a77b-ba55a3a16231
name: Wiz Code
description: >-
  Code-to-cloud application security pillar that secures the software development lifecycle from source code through CI/CD to the running cloud.
background: >-
  Wiz Code is the application security posture management (ASPM) pillar of the Wiz platform, extending Wiz's context-driven approach into the SDLC. It scans source code, dependencies, infrastructure as code, secrets, and CI/CD pipelines, then aggregates and correlates those findings with cloud risk through the Wiz Security Graph. Its code-to-cloud mapping traces runtime cloud risks back to the exact source file, pipeline, and developer, enabling one-click pull-request remediation before issues ever reach production.

id: 66c9eba4-0aee-4d9e-9437-a5354f489dcf
name: Cloud Detection and Response (CDR)
description: >-
  Delivers real-time runtime threat detection and response for cloud and AI-native threats.
background: >-
  Cloud Detection and Response is the core capability of Wiz Defend, monitoring cloud activity and workload behavior in real time to detect attacks as they unfold. It combines agentless analysis of cloud control-plane and audit data with runtime signals from the Wiz Sensor to identify threats such as compromised credentials, lateral movement, and crypto-mining. Detections are enriched with Wiz Security Graph context so responders immediately understand the affected resources, blast radius, and recommended response.

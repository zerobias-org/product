id: c8e77b8e-0935-4acc-b70c-49139efe9b16
name: Cloud Workload Protection (CWP)
description: >-
  Provides runtime workload protection via the Wiz Sensor for virtual machines, containers, and serverless.
background: >-
  Cloud Workload Protection adds a runtime layer to Wiz's agentless posture management using the lightweight, eBPF-based Wiz Sensor. Deployed on VMs, containers, and serverless workloads, the sensor detects and can block malicious behavior such as suspicious process execution, file changes, and network activity in real time. Runtime signals are fused with agentless posture data in the Wiz Security Graph, giving teams both deep prevention and contextual prioritization without managing heavyweight agents everywhere.

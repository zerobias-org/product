id: 59aa4ad2-2348-4694-95b9-b86167ab93e4
name: Attack Path Analysis
description: >-
  Identifies high-probability toxic combinations of cloud and AI risk using the Wiz Security Graph.
background: >-
  Attack Path Analysis interprets the Wiz Security Graph to model how an attacker could chain together individual weaknesses — a vulnerability, a misconfiguration, an excessive entitlement, and an exposed asset — into a path to critical resources or data. Instead of overwhelming teams with isolated findings, it highlights the small number of attack paths that pose the greatest real-world risk and pinpoints the single choke points that break them. This lets security teams achieve outsized risk reduction by remediating the few issues that matter most.

id: ea4b39e9-2bb5-4356-910f-3c882ea65c88
name: Application Security Posture Management (ASPM)
description: >-
  Aggregates and correlates findings from built-in and third-party scanners such as SAST, SCA, and DAST.
background: >-
  ASPM is the unifying capability of Wiz Code, consolidating application security findings from Wiz's own scanners and from third-party SAST, SCA, DAST, and other tools into a single view. It deduplicates and correlates results, then prioritizes them using cloud and runtime context from the Wiz Security Graph so teams focus on the application risks that are actually exploitable in production. By giving AppSec and development teams one prioritized backlog instead of siloed scanner outputs, it streamlines remediation across the SDLC.

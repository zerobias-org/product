id: 50d26615-cf59-4fd2-8336-eb49745808a4
name: Cloud Asset Inventory (CAASM)
description: >-
  Provides a unified inventory of all cloud assets across AWS, Azure, GCP, OCI, and Alibaba Cloud.
background: >-
  The Cloud Asset Inventory delivers a single, continuously updated catalog of every resource across an organization's multi-cloud and Kubernetes environments, addressing the cyber asset attack surface management (CAASM) problem of not knowing what you own. Built directly from agentless scanning and the Wiz Security Graph, it lets teams search, filter, and explore assets together with their configurations, relationships, and associated risks. This comprehensive visibility is the starting point for posture management, compliance reporting, and incident response across the platform.

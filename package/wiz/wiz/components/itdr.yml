id: e98370d0-1588-4ec2-b696-619e57f985f1
name: Identity Threat Detection & Response (ITDR)
description: >-
  Detects runtime anomalies in user behavior and access patterns that indicate malicious activity.
background: >-
  ITDR focuses Wiz Defend's detection capabilities on identity, monitoring how human and machine identities authenticate and act across cloud environments. It flags anomalous behavior — unusual access patterns, privilege escalation, and signs of compromised credentials — that often signal an active attack. By combining these runtime identity signals with the entitlement context from CIEM in the Wiz Security Graph, it gives responders a clear picture of both the identity's standing risk and its current suspicious activity.

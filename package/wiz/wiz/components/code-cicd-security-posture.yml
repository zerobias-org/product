id: 2bcb3dc9-5fd0-4d40-afaf-27adc3f75be9
name: Code & CI/CD Security Posture
description: >-
  Hardens version-control and CI/CD systems against misconfigurations and insecure defaults.
background: >-
  This capability assesses the security posture of the development toolchain itself — source-code management platforms, build systems, and CI/CD pipelines — for misconfigurations, weak access controls, and insecure defaults. It applies posture management principles to the pipeline so the infrastructure that builds and ships software is as well governed as the cloud it deploys to. By correlating pipeline weaknesses with downstream cloud risk through the Wiz Security Graph, it helps teams close supply-chain gaps that attackers increasingly target.

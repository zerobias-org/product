id: 8d024627-3b5e-466e-9695-38344989b1d5
name: Secrets Scanning
description: >-
  Finds and helps remediate hardcoded secrets in code, infrastructure-as-code templates, and container images.
background: >-
  Secrets Scanning detects exposed credentials — API keys, tokens, passwords, and certificates — embedded in source code, IaC templates, and container images before they can be abused. It scans across the development pipeline and into built artifacts so leaked secrets are caught both at commit time and in what ultimately ships. By linking a discovered secret to the cloud resources it can unlock through the Wiz Security Graph, it shows teams the blast radius of an exposure and helps them prioritize rotation and remediation.

id: 8861929a-98cc-4a78-8250-344712466d8c
name: Code-to-Cloud Mapping
description: >-
  Traces cloud risks back to source code, pipeline, and developer, enabling one-click fix pull requests.
background: >-
  Code-to-Cloud Mapping is the connective tissue of Wiz Code, linking a risk discovered in a running cloud resource back to the exact source file, infrastructure-as-code definition, pipeline, and developer that produced it. This traceability lets teams remediate at the root rather than patching symptoms in production, often through one-click pull requests that fix the originating code. By unifying code and cloud context in the Wiz Security Graph, it dramatically shortens the path from detection to durable fix.

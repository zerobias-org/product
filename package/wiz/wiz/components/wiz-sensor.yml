id: 7debb916-ab78-4be2-9b78-56aab9d64f4b
name: Wiz Sensor
description: >-
  An eBPF-powered lightweight runtime sensor that detects and blocks cloud threats in real time on VMs, containers, and serverless.
background: >-
  The Wiz Sensor is a lightweight, eBPF-based runtime agent that provides deep visibility into process, file, and network activity on VMs, containers, and serverless workloads. It detects and can actively block malicious runtime behavior — such as suspicious process execution, container drift, and known attack techniques — without the overhead of traditional heavyweight agents. The sensor feeds runtime telemetry into the Wiz Security Graph, complementing agentless data so Wiz Defend can both prevent threats inline and investigate them with full context.

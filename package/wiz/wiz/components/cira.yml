id: 9ff88c60-51fc-42e0-8642-df841188a5fa
name: Cloud Investigation & Response Automation (CIRA)
description: >-
  Combines agentless and agent-based runtime data for forensic collection and analysis during incident response.
background: >-
  CIRA accelerates cloud incident response by automating the collection and correlation of forensic data from both agentless sources and the Wiz Sensor. It assembles a timeline of an attack — affected resources, identities, and actions — so responders can quickly reconstruct what happened without manually gathering evidence across disparate cloud services. By grounding investigations in the Wiz Security Graph, it helps teams scope incidents accurately and drive faster, more confident response and remediation.

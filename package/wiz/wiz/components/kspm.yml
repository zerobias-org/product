id: 6cd1b69d-4385-4caf-956f-d1dde7fb1ae1
name: Container & Kubernetes Security (KSPM)
description: >-
  Secures containers, registries, and Kubernetes clusters from build time through runtime.
background: >-
  KSPM extends Wiz's posture management to containerized and Kubernetes environments, scanning container images, registries, and cluster configurations for vulnerabilities and misconfigurations. It assesses Kubernetes security against best-practice benchmarks and correlates container risk with the broader cloud context to expose attack paths that span workloads and clusters. Coverage runs from build-time image scanning through running clusters, giving platform and security teams consistent control over their container supply chain and runtime.

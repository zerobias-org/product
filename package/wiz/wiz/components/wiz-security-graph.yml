id: 8db556f3-1236-498f-8753-55d448384b07
name: Wiz Security Graph
description: >-
  A graph engine that maps resources, identities, vulnerabilities, and exposure to surface toxic-combination attack paths.
background: >-
  The Wiz Security Graph is the foundation of the entire Wiz platform, modeling every cloud resource, identity, configuration, vulnerability, and data store along with the relationships between them. By analyzing these connections, it reveals the toxic combinations of risk that together create real, exploitable attack paths — something siloed point tools cannot see. Every Wiz pillar and module draws on the graph for context-driven prioritization, which is what lets teams cut through alert noise and focus on the handful of issues that genuinely threaten their environment.

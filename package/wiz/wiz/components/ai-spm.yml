id: 9e90c44e-59ec-40e2-920e-6611364ad787
name: AI Security Posture Management (AI-SPM)
description: >-
  Provides visibility and risk mitigation across AI models, training data, and services, including an AI bill of materials.
background: >-
  AI-SPM secures the growing footprint of AI in the cloud by automatically discovering AI services, models, training data, and pipelines across an organization's environments. It builds an AI bill of materials (AI-BOM) and assesses these assets for misconfigurations, exposed data, and risky access that could be exploited. By bringing AI risk into the Wiz Security Graph alongside cloud and data context, it helps teams adopt AI safely and govern it against emerging AI security and compliance expectations.

id: 64c74060-7dff-4ae8-bafb-9661459d01de
name: SCA & SBOM
description: >-
  Provides visibility into every software component and detects vulnerabilities in direct and transitive dependencies.
background: >-
  Software composition analysis (SCA) inventories the open-source and third-party components an application depends on and identifies known vulnerabilities across both direct and transitive dependencies. It generates a software bill of materials (SBOM) that gives teams a complete, exportable picture of their software supply chain. By correlating dependency risk with where and how a component actually runs in the cloud, Wiz prioritizes the vulnerable packages that present real, reachable exposure rather than theoretical risk.

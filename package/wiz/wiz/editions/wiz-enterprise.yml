id: 7f3f44f9-16ef-4195-92a5-965393634234
name: Wiz Enterprise
description: >-
  The standard unified Wiz CNAPP platform, sold quote-based on a per-workload basis with the full modular set of Wiz Cloud, Wiz Code, and Wiz Defend plus add-ons.
background: >-
  Wiz Enterprise is the default commercial form of the Wiz platform for most organizations, delivering the complete unified cloud and AI security platform built on the Wiz Security Graph. It spans all three pillars — Wiz Cloud, Wiz Code, and Wiz Defend — and lets customers add modules to match their needs. Rather than fixed self-serve tiers, Wiz uses a modular, consumption-based licensing model in which price scales with cloud workloads, active developers, log-ingestion volume, and deployed Sensors, sold through a custom quote on wiz.io/pricing.

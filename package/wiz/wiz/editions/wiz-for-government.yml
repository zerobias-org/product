id: 41275e4d-3047-458a-bd52-c832b1ed1dae
name: Wiz for Government
description: >-
  A distinct FedRAMP High authorized edition of Wiz built on AWS GovCloud (US) for federal agencies and government-adjacent organizations.
background: >-
  Wiz for Government is a separately authorized environment of the Wiz platform built to meet the stringent requirements of the public sector. It is FedRAMP High authorized and runs on AWS GovCloud (US), making it a distinct operating environment rather than a feature flag on the commercial platform. It helps federal agencies and government-adjacent organizations secure their cloud estates while supporting compliance obligations such as FISMA, FedRAMP, CMMC, and ITAR, bringing the same Wiz Security Graph and CNAPP capabilities into an environment designed for regulated government workloads.

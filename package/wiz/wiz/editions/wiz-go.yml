id: 630e4f11-9bda-4805-9b92-23abcc3442cb
name: Wiz Go
description: >-
  A streamlined, startup-friendly bundle that packages core Wiz visibility and protection for fast-moving and smaller teams.
background: >-
  Wiz Go is a simplified bundle designed for startups and smaller, fast-moving teams that want enterprise-grade cloud security without enterprise-scale complexity. It packages Wiz's core visibility and protection capabilities into a streamlined offering with simpler packaging and onboarding, available as the "Wiz Go Bundle" on the AWS Marketplace. It gives growing organizations an accessible entry point to the Wiz Security Graph and posture management while preserving a path to expand into the full platform as their needs mature.

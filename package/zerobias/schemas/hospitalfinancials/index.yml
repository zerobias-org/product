description: >-
  Hospital financial data model, starting with lab send-out economics: what a test
  costs (reference lab fee schedules and invoices), what the hospital billed
  (chargemaster, charges, 837 claims), what each payer actually paid (835
  remittances, adjustments, provider-level takebacks), and the benchmarks to compare
  against (CLFS, payer contract rates). Clinical context arrives over HL7, the
  financial half over X12; the schema is the join spine between them.
